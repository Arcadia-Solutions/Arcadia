[workspace]
members = [
  "backend/api",
  "backend/common",
  "backend/periodic-tasks",
  "backend/storage", "tracker/arcadia_tracker", "shared",
]

resolver = "2"

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
allow_attributes = "warn"
unused_async = "warn"
unused_self = "warn"
needless_pass_by_value = "warn"

# http2 is left out: it pulls the vulnerable h2 0.3 and the backends sit behind a reverse proxy.
[workspace.dependencies]
actix-web = { version = "4", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "cookies", "unicode", "compat"] }
actix-cors = "0.7.1"
actix-http = "3.12.1"
actix-multipart = "0.7.2"
actix-multipart-rfc7578 = "0.11.0"
actix-web-httpauth = "0.8.2"
actix-web-lab = "0.26.0"
anyhow = "1.0.102"
argon2 = "0.5.3"
async-stream = "0.3"
async_zip = "0.0.17"
base64 = "0.22"
bip_metainfo = "0.12.0"
bytes = "1.11.1"
cargo-husky = { version = "1.5", default-features = false }
chrono = { version = "0.4.44", default-features = false }
deadpool = "0.13.0"
deadpool-redis = "0.23.0"
futures = "0.3"
futures-util = "0.3.32"
indexmap = { version = "2.14.0", default-features = false }
ipnetwork = "0.21"
jsonwebtoken = "10.4.0"
lettre = "0.11"
libc = "0.2"
log = "0.4"
musicbrainz_rs = "0.13.0"
opentelemetry = "0.32"
opentelemetry-appender-tracing = "0.32"
opentelemetry-otlp = "0.32"
opentelemetry_sdk = "0.32"
parking_lot = "0.12.5"
percent-encoding = "2.3.2"
rand = { version = "0.10.1", default-features = false }
redis = "1.2.1"
regex = "1.12.3"
reqwest = "0.12"
ringmap = "0.2.5"
serde = "1.0"
serde_bencode = "0.2.4"
serde_json = "1.0"
serde_qs = "1.1"
serde_urlencoded = "0.7.1"
sha2 = "0.10"
sqlx = "0.9"
strum = "0.28"
subtle = "2"
thiserror = { version = "2.0.18", default-features = false }
tmdb-api = "1.0.0-alpha.5"
tokio = { version = "1.52.3", default-features = false }
tokio-cron-scheduler = "0.15"
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-opentelemetry = "0.33"
tracing-subscriber = "0.3"
url = "2"
urlencoding = "2.1"
utoipa = "6"
utoipa-swagger-ui = "10"
yaml_serde = "0.10"
zip = { version = "9", default-features = false }

arcadia-common = { path = "backend/common" }
arcadia-periodic-tasks = { path = "backend/periodic-tasks" }
arcadia-shared = { path = "shared" }
arcadia-storage = { path = "backend/storage" }

[profile.release]
lto = true
debug = false
opt-level = 3
strip = true

[profile.dev]
debug = "line-tables-only"

# password hashing at opt-level 0 makes every login in tests and local dev take far longer
[profile.dev.package.argon2]
opt-level = 3

[patch.crates-io]
bip_metainfo = { path = "backend/api/vendored/bip_metainfo" }
