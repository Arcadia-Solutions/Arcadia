[package]
name = "arcadia-api"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"
# every file in tests/ is a module of the single `it` binary, so the app is linked once
autotests = false

[lints]
workspace = true

[dependencies]
actix-web.workspace = true
async-stream.workspace = true
async_zip = { workspace = true, features = ["tokio"] }
base64.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
chrono = { workspace = true, default-features = true, features = ["serde"] }
futures-util.workspace = true
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }
argon2.workspace = true
subtle.workspace = true
futures.workspace = true
rand = { workspace = true, default-features = true }
bip_metainfo.workspace = true
actix-multipart.workspace = true
reqwest = { workspace = true, features = ["json", "multipart"] }
actix-cors.workspace = true
actix-http.workspace = true
tracing.workspace = true
tracing-actix-web.workspace = true
utoipa = { workspace = true, features = ["actix_extras"] }
utoipa-swagger-ui = { workspace = true, features = ["actix-web"] }
serde_bencode.workspace = true
actix-web-httpauth.workspace = true
tokio = { workspace = true, default-features = true, features = ["full"] }
lettre.workspace = true
log.workspace = true
regex.workspace = true
musicbrainz_rs = { workspace = true, features = ["async"] }
tmdb-api.workspace = true
arcadia-common.workspace = true
arcadia-storage.workspace = true
arcadia-periodic-tasks.workspace = true
arcadia-shared.workspace = true
serde_urlencoded.workspace = true
serde_qs.workspace = true
url = { workspace = true, features = ["serde"] }
sha2.workspace = true

[dev-dependencies]
actix-multipart-rfc7578.workspace = true
bytes.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "chrono", "ipnetwork"] }
redis.workspace = true
urlencoding.workspace = true
zip = { workspace = true, features = ["deflate"] }

[[test]]
name = "it"
path = "tests/main.rs"
