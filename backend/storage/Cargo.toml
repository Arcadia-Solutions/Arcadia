[package]
name = "arcadia-storage"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
actix-web.workspace = true
actix-multipart.workspace = true
arcadia-common.workspace = true
argon2.workspace = true
bip_metainfo.workspace = true
chrono = { workspace = true, default-features = true, features = ["serde"] }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "chrono", "ipnetwork", "json"] }
ipnetwork = { workspace = true, features = ["serde"] }
thiserror = { workspace = true, default-features = true }
redis = { workspace = true, features = ["tokio-comp"] }
deadpool = { workspace = true, features = ["rt_tokio_1"] }
deadpool-redis = { workspace = true, features = ["rt_tokio_1"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
strum = { workspace = true, features = ["derive"] }
musicbrainz_rs.workspace = true
rand = { workspace = true, default-features = true }
utoipa = { workspace = true, features = ["actix_extras"] }
log.workspace = true
arcadia-shared.workspace = true
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true, default-features = true, features = ["sync"] }
url.workspace = true

[dev-dependencies]
cargo-husky = { workspace = true, features = ["user-hooks"] }

# actix-web is referenced by the code generated by the MultipartForm derive, ipnetwork is only pulled in
# to enable its serde feature while the type is used through sqlx::types::ipnetwork
[package.metadata.cargo-machete]
ignored = ["actix-web", "ipnetwork"]
