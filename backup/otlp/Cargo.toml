# Standalone crate (own [workspace] so the root arcadia workspace ignores it): built only by
# backup/cron.Dockerfile, into a static musl binary baked into the backup image. See src/main.rs.
[package]
name = "arcadia-otlp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "arcadia-otlp"
path = "src/main.rs"

[dependencies]
serde_json = "1.0.154"
# http only (the OTLP endpoint is an in-cluster host:4318), so no TLS: default-features off drops
# rustls/ring and keeps the binary small and C-free.
ureq = { version = "3.4", default-features = false }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"

[workspace]
