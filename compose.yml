services:
  db:
    image: postgres:18
    restart: always
    shm_size: 128mb
    volumes:
      - db_data:/var/lib/postgresql/
    environment:
      POSTGRES_USER: ${ARCADIA_DATABASE__USER:-arcadia}
      POSTGRES_PASSWORD: ${ARCADIA_DATABASE__PASSWORD:-password}
      POSTGRES_DB: ${ARCADIA_DATABASE__NAME:-arcadia}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ARCADIA_DATABASE__USER:-arcadia} -d ${ARCADIA_DATABASE__NAME:-arcadia}"]
      interval: 5s
      timeout: 5s
      retries: 5

  init_db:
    build:
      context: ./
      dockerfile: backend/api/Dockerfile
      # Stage with sqlx-cli and the migrations only, so this does not depend on the backend
      # binary being compiled first.
      target: initdb
    command: sh -c "/init_db.sh"
    working_dir: /app
    volumes:
      - ./backend/storage/scripts/init_db.sh:/init_db.sh
    environment:
      DATABASE_URL: postgresql://${ARCADIA_DATABASE__USER:-arcadia}:${ARCADIA_DATABASE__PASSWORD:-password}@db:5432/${ARCADIA_DATABASE__NAME:-arcadia}
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis
    restart: always
    volumes:
      - redis_data:/data
    command: ["redis-server", "--requirepass", "${ARCADIA_REDIS__PASSWORD:-password}"]

  backend:
    build:
      context: ./
      dockerfile: backend/api/Dockerfile
    volumes:
      - ./config.yml:/app/config.yml:ro
    environment:
      ARCADIA_DATABASE__HOST: db
      ARCADIA_DATABASE__PORT: 5432
      ARCADIA_DATABASE__USER: ${ARCADIA_DATABASE__USER:-arcadia}
      ARCADIA_DATABASE__PASSWORD: ${ARCADIA_DATABASE__PASSWORD:-password}
      ARCADIA_DATABASE__NAME: ${ARCADIA_DATABASE__NAME:-arcadia}
      ARCADIA_REDIS__HOST: redis
      ARCADIA_REDIS__PASSWORD: ${ARCADIA_REDIS__PASSWORD:-password}
      ARCADIA_ERGO__API_BEARER_TOKEN: ${ARCADIA_ERGO__API_BEARER_TOKEN:-changeme}
      ARCADIA_ERGO__AUTH_CALLBACK_TOKEN: ${ARCADIA_ERGO__AUTH_CALLBACK_TOKEN:-changeme}
      RUST_BACKTRACE: 1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      init_db:
        condition: service_completed_successfully
      redis:
        condition: service_started
      otel-lgtm:
        condition: service_started
        required: false
    develop:
      watch:
        - path: ./backend/api
          action: rebuild
        - path: ./config.yml
          action: restart

  tracker:
    build:
      context: ./
      dockerfile: tracker/arcadia_tracker/Dockerfile
    ports:
      # only reachable from the host, the public announce url goes through the reverse proxy
      - 127.0.0.1:8081:8081 # BitTorrent client announce/scrape port
    volumes:
      - ./config.yml:/app/config.yml:ro
    environment:
      ARCADIA_DATABASE__HOST: db
      ARCADIA_DATABASE__PORT: 5432
      ARCADIA_DATABASE__USER: ${ARCADIA_DATABASE__USER:-arcadia}
      ARCADIA_DATABASE__PASSWORD: ${ARCADIA_DATABASE__PASSWORD:-password}
      ARCADIA_DATABASE__NAME: ${ARCADIA_DATABASE__NAME:-arcadia}
    depends_on:
      db:
        condition: service_healthy
      init_db:
        condition: service_completed_successfully
      otel-lgtm:
        condition: service_started
        required: false
    develop:
      watch:
        - path: ./tracker/arcadia_tracker
          action: rebuild
        - path: ./config.yml
          action: restart

  # serves: arcadia's frontend, elysia's frontend and kiwiirc
  frontend:
    build:
      # the repository root, so that the build can read config.yml
      context: ./
      dockerfile: frontend/Dockerfile
      # Elysia's web UI, served under /elysia. Empty when the `elysia` submodule is not checked out.
      additional_contexts:
        elysia: ./elysia/frontend
      secrets:
        - arcadia_config
    ports:
      - 5173:80
    depends_on:
      backend:
        condition: service_started
    develop:
      watch:
        - path: ./frontend/dist
          action: sync
          target: /srv/arcadia
        - path: ./frontend/Caddyfile
          action: sync+restart
          target: /etc/caddy/Caddyfile
        - path: ./frontend/elysia.caddy
          action: sync+restart
          target: /etc/caddy/elysia.caddy

  otel-lgtm:
    profiles: [full, telemetry]
    image: grafana/otel-lgtm:0.41.0
    ports:
      - 3000:3000 # Grafana UI
    volumes:
      - lgtm_data:/data
      - ./opentelemetry/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/arcadia.yaml:ro
      - ./opentelemetry:/arcadia/opentelemetry:ro
      # the whole submodule, so that a missing checkout does not make docker create the dashboard path
      - ./elysia:/elysia:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-arcadia}
      GF_AUTH_ANONYMOUS_ENABLED: false
      # keep metrics, logs and traces for ~3 months (90 days)
      PROMETHEUS_EXTRA_ARGS: --storage.tsdb.retention.time=90d
      LOKI_EXTRA_ARGS: -compactor.retention-enabled=true -compactor.delete-request-store=filesystem -store.retention=2160h
      TEMPO_EXTRA_ARGS: -backend-scheduler.provider.work.compaction.block-retention=2160h -backend-worker.compaction.block-retention=2160h

  hostmetrics:
    profiles: [full, telemetry]
    image: otel/opentelemetry-collector-contrib:0.165.0
    restart: always
    pid: host
    privileged: true
    volumes:
      - /:/hostfs:ro
      - ./opentelemetry/hostmetrics.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      otel-lgtm:
        condition: service_started

  # Elysia, the image host. It has no published image: it is built from the `elysia` git submodule
  # (`git submodule update --init`), and reads elysia/config.yml, see docs/src/image-host.md.
  elysia_database:
    profiles: [full, images]
    image: postgres:18.7
    restart: always
    volumes:
      - elysia_database:/var/lib/postgresql/
    environment:
      POSTGRES_USER: ${ELYSIA_DB_USER:-elysia}
      POSTGRES_PASSWORD: ${ELYSIA_DB_PASSWORD:-password}
      POSTGRES_DB: ${ELYSIA_DB_NAME:-elysia}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ELYSIA_DB_USER:-elysia} -d ${ELYSIA_DB_NAME:-elysia}"]
      interval: 5s
      timeout: 5s
      retries: 5

  elysia_backend:
    profiles: [full, images]
    build:
      context: ./elysia/backend
      dockerfile: Dockerfile
    restart: always
    # Overrides the database section of elysia/config.yml.
    environment:
      ELYSIA_DATABASE__HOST: elysia_database
      ELYSIA_DATABASE__PORT: 5432
      ELYSIA_DATABASE__USER: ${ELYSIA_DB_USER:-elysia}
      ELYSIA_DATABASE__PASSWORD: ${ELYSIA_DB_PASSWORD:-password}
      ELYSIA_DATABASE__NAME: ${ELYSIA_DB_NAME:-elysia}
    volumes:
      - ./elysia/config.yml:/app/config.yml:ro
      # Keep storage.upload_dir at its default (./data/uploads) in elysia/config.yml.
      - elysia_storage:/app/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8090/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      elysia_database:
        condition: service_healthy

  # Deprecated: use Elysia (profile `images`) instead. Not in `full`: upgrades add `--profile chevereto`
  # to keep serving the images already hosted there.
  chevereto_database:
    profiles: [chevereto]
    image: mariadb:jammy
    volumes:
      - chevereto_database:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      MYSQL_ROOT_PASSWORD: ${CHEVERETO_DB_ROOT_PASS:-password}
      MYSQL_USER: ${CHEVERETO_DB_USER:-chevereto}
      MYSQL_PASSWORD: ${CHEVERETO_DB_PASS:-arcadia}
      MYSQL_DATABASE: ${CHEVERETO_DB_NAME:-chevereto}


  chevereto_php:
    profiles: [chevereto]
    image: chevereto/chevereto:4.5.9
    volumes:
      - chevereto_storage:/var/www/html/images/
    restart: always
    depends_on:
      chevereto_database:
        condition: service_healthy
    ports:
      - 8083:8080
    environment:
      CHEVERETO_DB_HOST: chevereto_database
      CHEVERETO_DB_PORT: 3306
      CHEVERETO_DB_USER: ${CHEVERETO_DB_USER:-chevereto}
      CHEVERETO_DB_PASS: ${CHEVERETO_DB_PASS:-arcadia}
      CHEVERETO_DB_NAME: ${CHEVERETO_DB_NAME:-chevereto}
      CHEVERETO_HOSTNAME: localhost
      CHEVERETO_HOSTNAME_PATH: /
      CHEVERETO_HTTPS: 0


  ergo_database:
    profiles: [full, irc]
    image: mariadb:jammy
    volumes:
      - ergo_database:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      MYSQL_ROOT_PASSWORD: ${ERGO__DATASTORE__MYSQL__ROOT_PASSWORD:-root_password}
      MYSQL_USER: ${ERGO__DATASTORE__MYSQL__USER:-ergo}
      MYSQL_PASSWORD: ${ERGO__DATASTORE__MYSQL__PASSWORD:-password}
      MYSQL_DATABASE: ${ERGO__DATASTORE__MYSQL__HISTORY_DATABASE:-ergo_history}

  ergo:
    profiles: [full, irc]
    image: ghcr.io/ergochat/ergo:stable
    restart: always
    ports:
      - 6667:6667 # Plain IRC for external desktop clients
    extra_hosts:
      - "host.docker.internal:host-gateway" # needed for the backend to reach ergo, if the backend runs outside and ergo in docker (typical dev setup)
    volumes:
      - ergo_data:/ircd
      - ./ergo/ergo-conf.yaml:/ircd/ircd.yaml:ro
      - ./ergo/ergo.motd:/ircd/ergo.motd:ro
    depends_on:
      ergo_database:
        condition: service_healthy
    environment:
      ERGO__DATASTORE__MYSQL__HOST: ergo_database
      ERGO__DATASTORE__MYSQL__PORT: 3306
      ERGO__DATASTORE__MYSQL__USER: ${ERGO__DATASTORE__MYSQL__USER:-ergo}
      ERGO__DATASTORE__MYSQL__PASSWORD: ${ERGO__DATASTORE__MYSQL__PASSWORD:-password}
      ERGO__DATASTORE__MYSQL__HISTORY_DATABASE: ${ERGO__DATASTORE__MYSQL__HISTORY_DATABASE:-ergo_history}
      ERGO__API__BEARER_TOKENS: '[ "${ARCADIA_ERGO__API_BEARER_TOKEN:-changeme}" ]'
      ARCADIA_ERGO__AUTH_CALLBACK_TOKEN: ${ARCADIA_ERGO__AUTH_CALLBACK_TOKEN:-changeme}

  # Docker mode only: a cron that runs backup/backup.sh on the schedule of backup.cron, inside this
  # container. It dumps the databases over the compose network and runs restic in-container: no
  # docker socket, no docker cli. The volumes are mounted read only at /data/<name>.
  backup_cron:
    profiles: [backup]
    build:
      context: ./
      dockerfile: backup/cron.Dockerfile
    restart: always
    environment:
      ARCADIA_DATABASE__HOST: db
      ARCADIA_DATABASE__PORT: 5432
      ARCADIA_DATABASE__USER: ${ARCADIA_DATABASE__USER:-arcadia}
      ARCADIA_DATABASE__PASSWORD: ${ARCADIA_DATABASE__PASSWORD:-password}
      ARCADIA_DATABASE__NAME: ${ARCADIA_DATABASE__NAME:-arcadia}
      ERGO_DB_NAME: ${ERGO__DATASTORE__MYSQL__HISTORY_DATABASE:-ergo_history}
      ERGO_DB_USER: ${ERGO__DATASTORE__MYSQL__USER:-ergo}
      ERGO_DB_PASSWORD: ${ERGO__DATASTORE__MYSQL__PASSWORD:-password}
      CHEVERETO_DB_NAME: ${CHEVERETO_DB_NAME:-chevereto}
      CHEVERETO_DB_USER: ${CHEVERETO_DB_USER:-chevereto}
      CHEVERETO_DB_PASSWORD: ${CHEVERETO_DB_PASS:-arcadia}
      ELYSIA_DB_NAME: ${ELYSIA_DB_NAME:-elysia}
      ELYSIA_DB_USER: ${ELYSIA_DB_USER:-elysia}
      ELYSIA_DB_PASSWORD: ${ELYSIA_DB_PASSWORD:-password}
    volumes:
      # Read only: the job backs the installation up, it does not change it.
      - .:/arcadia:ro
      - ${BACKUP_DIR:-/var/backups/arcadia}:/var/backups/arcadia
      - ${RESTIC_PASSWORD_FILE:-/root/.arcadia-restic-password}:/root/.arcadia-restic-password:ro
      - redis_data:/data/redis_data:ro
      - ergo_data:/data/ergo_data:ro
      - chevereto_storage:/data/chevereto_storage:ro
      - elysia_storage:/data/elysia_storage:ro

secrets:
  # Read by the frontend build, which inlines the `frontend` section in the bundle.
  arcadia_config:
    file: ./config.yml

volumes:
  db_data:
  redis_data:
  lgtm_data:
  chevereto_database:
  chevereto_storage:
  elysia_database:
  elysia_storage:
  ergo_data:
  ergo_database:
