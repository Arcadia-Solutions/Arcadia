# Arcadia configuration. This file documents every key, it is the reference.
#
#
# How it is read:
#   - backend, tracker and periodic tasks read it at startup. `config.yml` is looked up in
#     the current directory and its parents, so they can be run from the repository root or
#     from their own crate directory. Set the ARCADIA_CONFIG environment variable to use a
#     file located elsewhere.
#   - the `frontend` section is inlined in the bundle by vite.config.ts at build time, so
#     the frontend has to be rebuilt after changing it.
#   - in Docker Compose, db and redis credentials are configured in .env and injected
#     into the containers as environment variables; the `database` and `redis` sections
#     below are only needed for bare-metal installations.
#
# Nothing is reloaded at runtime: changing a value means restarting the affected service.
#
# Environment Variable Overrides:
#   Any setting in this file can be overridden (or provided without this file) via
#   environment variables using the ARCADIA_<SECTION>__<KEY> convention.
#   Environment variables always take precedence over values in this file.
#   For example:
#     ARCADIA_DATABASE__PASSWORD=secret overrides database.password
#     ARCADIA_DATABASE__HOST=db         overrides database.host
#     ARCADIA_API__PORT=8080            overrides api.port
#     ARCADIA_TRACKER__PORT=8081        overrides tracker.port
#
# One setting is NOT here: DATABASE_URL. The sqlx query macros check the queries against a
# real database at compile time and only read that environment variable, so it belongs in a
# `.env` file at the root of the repository. It is a build-time requirement for development.


# Bare-metal: uncomment and configure for host PostgreSQL and Redis.
# In Docker Compose, database and Redis credentials are configured in .env instead.
#
# database:
#   host: 127.0.0.1
#   port: 5432
#   user: arcadia
#   password: your_secure_password
#   name: arcadia
#
# redis:
#   host: 127.0.0.1
#   port: 6379
#   password: ""

api:
  # Address the backend listens on.
  host: 0.0.0.0
  port: 8080
  # Secret key used for JWT authentication.
  # Production: must be set to a secure random key (e.g. openssl rand -hex 32).
  jwt_secret: sensitivejwtsecret
  # Possible values: "error", "warn", "info", "debug", "trace", "off".
  # A level can be set per module, e.g. "debug,sqlx=info".
  # Development: set to "debug,sqlx=debug" for verbose SQL query logging.
  # Overridden by the RUST_LOG environment variable when it is set.
  log_level: "info,sqlx=info"
  # Public URL of the frontend.
  # Production: set to your domain. Included in email verification and password reset links.
  frontend_url: https://example.com
  # Biggest page_size accepted on the paginated endpoints. Requests asking for more get this
  # amount of results instead.
  max_page_size: 100

  # Optional: TMDB API, for movie and TV metadata. Signup on themoviedb.org
  # tmdb_api_key: your_tmdb_api_key

  # Optional: Comic Vine API. Signup on comicvine.gamespot.com/api/
  # comic_vine_api_key: your_comic_vine_api_key

  # Optional: proxy for the requests made to external services (TMDB, MusicBrainz, etc.).
  # Internal requests (tracker, irc, image host, etc.) are not affected.
  # http_proxy: socks5://127.0.0.1:9050

  # Optional: services checking where the registration ip of the users comes from (geolocation,
  # vpn, proxy, tor, datacenter). The ip is checked in the background on registration (the
  # result is stored), and on demand by the users with the view_registration_ips permission
  # (the result is only stored if they choose to). The users whose ip was never checked can be
  # checked with a maintenance tool.
  # A provider is enabled when its entry is present. They are tried from the lowest priority
  # number to the highest one, the next one being used when a provider fails (down, rate
  # limited, quota exhausted, etc.). Their requests go through http_proxy when it is set.
  # Private addresses (e.g. when the client ip is not forwarded by the reverse proxy) are not
  # checked.
  # ip_check_providers:
  #   # proxycheck.io: 100 requests per day without a key, 1000 with a free account's key.
  #   proxycheck:
  #     priority: 1
  #     api_key: your_proxycheck_api_key
  #   # ipapi.is: 1000 requests per day with a free account's key (required).
  #   ipapi_is:
  #     priority: 2
  #     api_key: your_ipapi_is_api_key
  #   # IPQualityScore: 1000 requests per month with a free account's key (required).
  #   ipqualityscore:
  #     priority: 3
  #     api_key: your_ipqualityscore_api_key
  #   # vpnapi.io: 1000 requests per day with a free account's key (required). No datacenter flag.
  #   vpnapi:
  #     priority: 4
  #     api_key: your_vpnapi_api_key
  #   # ip-api.com: no key, 45 requests per minute, free for non-commercial use only. Its proxy
  #   # flag also covers vpns and tor.
  #   # WARNING: its free tier is http only, the ips of the users are sent unencrypted.
  #   ip_api:
  #     priority: 5

tracker:
  # Address the tracker listens on.
  host: 0.0.0.0
  port: 8081
  # Name of the tracker.
  name: Arcadia
  # Public URL of the tracker, the one written in the .torrent files.
  # Production: set to your public tracker subdomain (e.g. https://tracker.example.com).
  url: http://localhost:8081
  # URL used by the backend to reach the tracker.
  # Bare-metal: set to http://localhost:8081 (defaults to Docker container hostname).
  url_internal: http://tracker:8081
  # Shared secret used for the backend to make requests to the tracker and vice-versa.
  # Production: must be set to a secure random key.
  api_key: change_me
  # Possible values: "error", "warn", "info", "debug", "trace", "off".
  # A level can be set per module, e.g. "debug,sqlx=info".
  # Overridden by the RUST_LOG environment variable when it is set.
  log_level: "info,sqlx=info"
  # Optional: custom `source` tag injected into the info dictionary of every generated
  # .torrent file. Enables safe cross-seeding by making this tracker's torrents distinct
  # from other trackers'.
  torrent_source_tag: Arcadia
  # Allowed torrent clients by peer id, without their leading "-".
  # a client is allowed if the prefix of the peer id matches
  # https://www.bittorrent.org/beps/bep_0020.html
  allowed_torrent_clients:
    # BiglyBT
    - BI3500
    - BI3600
    - BI3700
    - BI3800
    - BI3900
    - BI4000
    - BI4100
    # Deluge
    - DE12
    - DE13
    - DE2
    # FlashGet
    - FL149
    - FL1490
    # Halite
    - HL04
    # KTorrent
    - KT21
    - KT23
    - KT24
    - KT5
    - KT25
    - KT26
    # LibTorrent (rTorrent)
    - LT
    - lt0D
    - lt0E
    - lt0F
    # qBittorrent
    - qB2
    - qB3
    - qB40
    - qB41
    - qB42
    - qB43
    - qB44
    - qB45
    - qB46
    - qB50
    - qB51
    - qB52
    - qB53
    # Transmission
    - TR2
    - TR3000
    - TR4010
    - TR4020
    - TR4030
    - TR4040
    - TR4050
    - TR4060
    - TR4100
    - TR4110
    - TR4120
    - TR4130
    - TR4140
  # Amount of peers sent back when the peer does not include a numwant.
  numwant_default: 15
  # Max amount of peers sent back when the peer's numwant is too high.
  numwant_max: 15
  # A random amount of seconds between announce_min and announce_max is returned to the
  # peer as the time of its next announce.
  announce_min: 1800
  announce_max: 3600
  # Announcing before this many seconds after the previous announce returns a rate limit error.
  announce_min_enforced: 1740
  # Max amount of active peers a user is allowed to have on a torrent. Prevents abuse from
  # malicious users causing the server to run out of ram, and keeps the peer lists from being
  # filled with too many clients of a single user.
  max_peers_per_torrent_per_user: 3
  # Interval between the flushes of history, peers, torrents and users to the database.
  flush_interval_milliseconds: 3000
  # Amount of seconds between the batches marking peers as inactive or erasing them.
  peer_expiry_interval: 1800
  # Amount of seconds since the last announce before a peer is considered inactive.
  active_peer_ttl: 7200
  # Amount of seconds since the last announce before a peer is erased from memory. This value
  # should be long enough that users can suffer multi-day network outages without announcing,
  # otherwise if their setup comes back online and the peer has been erased, then their new
  # stats will be recorded incorrectly.
  inactive_peer_ttl: 1814400
  # Optional: header provided by the reverse proxy that contains the original ip address of
  # the bittorrent client. The last address of the comma separated list is selected. Leave it
  # unset to select the connecting ip address when there is no reverse proxy. A reverse proxy
  # is required when listening on unix sockets.
  # Production: set to X-Forwarded-For when using Caddy or a standard reverse proxy.
  # reverse_proxy_client_ip_header_name: X-Forwarded-For

periodic_tasks:
  # Custom formula for bonus points calculation. It can contain SQL functions.
  # Available variables:
  #   - seedtime: total seed time in seconds
  #   - seeders: number of seeders for the torrent
  #   - size: torrent size in bytes
  # Example: "(size / (seeders + 1)) * (seedtime / 3600)"
  bonus_points_formula: "size / (seeders + 1)"
  # All the intervals below are in seconds.
  # User class promotion/demotion checks.
  user_class_changes_seconds: 3600
  # Seedtime and bonus points updates.
  seedtime_and_bonus_points_update_seconds: 1800
  # User torrent stats updates (seeding, leeching, snatched, seeding size).
  user_torrent_stats_update_seconds: 3600
  # Checking and banning inactive users.
  inactive_user_ban_seconds: 86400
  # Refreshing the title_group_hierarchy_lite materialized view, used for the torrent search.
  materialized_view_refresh_seconds: 120
  # Clearing expired user warnings.
  expired_warnings_seconds: 3600
  # Aggregating artist peer stats (seeders, leechers, snatches) from torrents.
  artist_peer_stats_update_seconds: 1800
  # Evaluating user auto-badges.
  user_badges_evaluation_seconds: 86400
  # Removing resolved and stale tracker announce errors.
  announce_errors_cleanup_seconds: 900
  # Announce errors not seen again within this delay are considered stale and removed.
  # Must be longer than the tracker's announce interval.
  announce_errors_retention_seconds: 86400
  # Removing the reseed requests of torrents that have seeders again and no waiting leecher.
  reseed_request_cleanup_seconds: 900

# Optional: emails are skipped entirely when this section is incomplete.
# Production: configure so users can verify accounts, receive invites, and reset passwords.
# smtp:
#   host: smtp.gmail.com
#   port: 587
#   username: your-email@gmail.com
#   password: your-app-password
#   from_email: noreply@yourtracker.com
#   from_name: Arcadia Tracker

# Optional: Chevereto image host.
# image_host:
#   chevereto_api_url: http://chevereto_php/api/1/upload
#   chevereto_api_key: your_chevereto_api_key
#   # Automatically rehost the images coming from the external database scrapers.
#   rehost_external_images: false

# Optional: Ergo IRC daemon, for the IRC chat integration.
# In Docker Compose, the bearer token and auth callback token are managed in .env
# (ARCADIA_ERGO__API_BEARER_TOKEN and ARCADIA_ERGO__AUTH_CALLBACK_TOKEN) and injected
# via environment variables. For Docker, only `api_url` is needed below.
# Bare-metal: enable the API in ergo-conf.yaml and configure all fields below.
# ergo:
#   api_url: http://ergo:8089
#   api_bearer_token: your_ergo_api_bearer_token
#   # Token that Ergo sends when calling the auth callback endpoint.
#   auth_callback_token: your_ergo_auth_callback_token

# Optional: OpenTelemetry, for traces, logs and metrics. Shared by every service (the log level
# is configured per service, in the sections above). When set, telemetry data is exported via
# OTLP gRPC to this endpoint. When unset, only stdout logging is active.
# Bare-metal: use http://localhost:4317 if running an OpenTelemetry collector on the host.
# telemetry:
#   otlp_endpoint: http://otel-lgtm:4317

frontend:
  # Base URL of the API the frontend talks to. Leave empty for relative paths (proxied by Caddy or Vite dev server).
  api_base_url: ""
  # Name of the site, displayed in the interface.
  site_name: Arcadia
  # When true, unauthenticated users are served public/home/index.html at /.
  enable_custom_front_page: false
  # Label displayed on the big input of /apply.
  apply_input_message: Why should we let you in
  # Message shown once the user sent their application.
  application_sent_message: "Application sent! You will hear back from us if you're selected."
  # Optional: kiwiirc settings.
  # URL where the Kiwi IRC webchat is served. Defaults to /kiwiirc/ for both Docker (served by
  # Caddy) and local Vite dev (served by Vite when kiwiirc/dist is present).
  irc_webchat_url: /kiwiirc/
  # WebSocket URL of the IRC server (Ergo). Defaults to /webirc/websocket for both Docker
  # (proxied by Caddy) and local Vite dev (proxied by Vite to Ergo when exposed on port 8097).
  irc_websocket_url: /webirc/websocket
  # Channels guests auto join when opening the webchat from the auth page, as a
  # `Guest-<number>` nickname. Leave empty (or unset) to hide the link. Requires ergo to run with
  # `accounts.require-sasl.enabled: false`, since guests connect without an account; keep members
  # only channels closed with the +r (registered-only) channel mode.
  irc_webchat_guest_channels:
    - "#help"

# Optional: external sources (scrapers) provided by plugins running as separate services.
# The `id` must not clash with a built in source (tmdb, musicbrainz, isbn, comic-vine), and is
# used in the route /api/external-sources/<id>. `timeout_seconds` defaults to 30.
# Declare the plugin services themselves in compose.override.yml.
# scrapers:
#   - id: anime
#     placeholder: Anime url
#     # The websites the endpoint accepts links from, each with the content types it supports.
#     # A single endpoint may serve several websites, dispatching on the link it is given.
#     # They are listed in a tooltip next to the input on the upload page, once there are
#     # several of them. The source is offered for every content type at least one of them supports.
#     sources:
#       AniDB:
#         - tv_show
#       MyAnimeList:
#         - tv_show
#         - movie
#     url: http://anime-plugin:9000/scrape
#     timeout_seconds: 30

# Optional: lets Elysia SSO its users via Arcadia's OpenID Connect provider (authorization
# code + PKCE + userinfo, no ID token). issuer is {public API url}/api/oauth, configured
# identically in Elysia. Elysia also checks bans at {issuer}/users/{sub}/status. Generate the
# secret with e.g. `openssl rand -hex 32`.
# oidc:
#   issuer: https://arcadia.example.com/api/oauth
#   client_id: elysia
#   client_secret: the_client_secret
#   redirect_uri: https://elysia.example.com/auth/sso/callback

# Backups, made by backup/backup.sh and restored by backup/restore.sh, see docs/src/backup.md.
# Values are plain scalars without spaces, lists are space separated. Paths are absolute.
backup:
  # docker: the databases are dumped over the compose network and restic runs in the backup_cron
  # container (no docker socket). Run it by hand with:
  # docker compose --profile backup run --rm --entrypoint /arcadia/backup/backup.sh backup_cron
  # backup.sh cannot run on the host in docker mode: the DB service names resolve only on the
  # compose network.
  # host: restic, pg_dump and mariadb-dump run on the host (run the scripts as root).
  mode: docker
  # docker mode only: when the `backup_cron` compose service (profile `backup`) runs backup.sh, in
  # cron syntax, read in cron_timezone. The one value of this section that does hold spaces.
  # Empty = no cron, use a systemd timer on the host instead.
  cron: "0 3 * * *"
  # timezone backup.cron is read in, containers have none (UTC when empty)
  cron_timezone: UTC
  # repo, password_file and dump_dir below are HOST MODE ONLY. In docker mode they are ignored: the
  # repo and dumps live under BACKUP_DIR and the password file at RESTIC_PASSWORD_FILE (both set in
  # .env), bind-mounted at fixed paths inside backup_cron. Set only those two .env variables there.
  # local restic repository
  repo: /var/backups/arcadia/repo
  # restic repository password. Keep a copy elsewhere: it is not part of the backups.
  password_file: /root/.arcadia-restic-password
  # where the dumps are written before being backed up, removed afterwards
  dump_dir: /var/backups/arcadia/dumps
  # retention, passed to `restic forget` as is. Must outlast the longest backup host outage.
  keep: --keep-daily 7 --keep-weekly 4
  # space-separated list of repositories the snapshots are copied to (local paths, s3:, rest:, …), empty = none
  remote_repo: ""
  # docker mode: volumes backed up raw, unprefixed compose volume names, mounted at /data/<name> by
  # the backup_cron service. Each name must ALSO be mounted at /data/<name> in the backup_cron
  # service in compose.yml. The database volumes are never listed: they are dumped.
  volumes: chevereto_storage ergo_data redis_data
  # host mode: directories backed up raw
  paths: ""
  # host mode: mariadb databases, dumped as root through the unix socket, empty = skipped.
  # In docker mode they are dumped when their service runs.
  ergo_db: ""
  chevereto_db: ""
