[package]
name = "arcadia-shared"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
yaml_serde.workspace = true
indexmap = { workspace = true, features = ["std", "serde"] }
anyhow = { workspace = true, features = ["std"] }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "chrono", "ipnetwork"] }
thiserror.workspace = true
chrono = { workspace = true, features = ["serde"] }
ringmap = { workspace = true, features = ["serde"] }
actix-web.workspace = true
log.workspace = true
tracing.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true, features = ["rt-tokio"] }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic", "trace", "logs", "metrics"] }
opentelemetry-appender-tracing.workspace = true
tracing-opentelemetry = { workspace = true, features = ["metrics"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
parking_lot.workspace = true
utoipa = { workspace = true, features = ["actix_extras"] }
