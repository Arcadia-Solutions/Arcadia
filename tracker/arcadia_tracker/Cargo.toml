[package]
name = "arcadia_tracker"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
actix-web.workspace = true
utoipa = { workspace = true, features = ["actix_extras"] }
utoipa-swagger-ui = { workspace = true, features = ["actix-web"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync"] }
tracing-actix-web.workspace = true
tracing.workspace = true
thiserror = { workspace = true, default-features = true }
actix-web-httpauth.workspace = true
serde = { workspace = true, features = ["derive"] }
strum = { workspace = true, features = ["derive", "std"] }
log.workspace = true
serde_bencode.workspace = true
arcadia-shared.workspace = true
opentelemetry = { workspace = true, features = ["metrics"] }
parking_lot.workspace = true
percent-encoding.workspace = true
subtle.workspace = true
rand = { workspace = true, features = ["alloc", "thread_rng"] }
chrono = { workspace = true, features = ["serde"] }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "chrono", "ipnetwork"] }

[dev-dependencies]
actix-http.workspace = true
yaml_serde.workspace = true
