database: { host: db, port: 5432, user: arcadia, password: password, name: arcadia }
tracker:
  api_key: e2e_api_key
  allowed_torrent_clients: [qB46, qB53]
  # clients get a random interval in announce_min..announce_max and the tests force reannounces,
  # min interval 1 and no enforced minimum so that forced reannounces are accepted right away
  announce_min: 1
  announce_max: 1800
  announce_min_enforced: 0
  flush_interval_milliseconds: 500
  # logs every announce with its query string
  log_level: "info,arcadia_tracker=debug"
